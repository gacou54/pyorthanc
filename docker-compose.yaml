services:
  orthanc1:
    ports:
      - "8042:8042"
    build:
      dockerfile: tests/orthanc/orthanc-for-test.Dockerfile
      context: .
    environment:
      PYTHON_PLUGIN_ENABLE: "true"
      ORTHANC__PYTHON_SCRIPT: "/python/script.py"
      ORTHANC__REGISTERED_USERS: '{"orthanc": "orthanc"}'
    depends_on:
      - orthanc2

  orthanc2:
    image: orthancteam/orthanc:26.11.0
    environment:
        ORTHANC_JSON: |
          {
            "RegisteredUsers": {
              "orthanc": "orthanc"
            },
            "DicomModalities": {
              "ORTHANC": [ "ORTHANC", "orthanc1", 4242 ]
            }
          }

  test:
    build:
      context: .
      dockerfile: tests/orthanc/pytest.Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    depends_on:
      - orthanc1
      - orthanc2
